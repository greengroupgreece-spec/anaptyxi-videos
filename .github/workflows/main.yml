
name: Daily Video Rotation

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update videos
        run: python update_videos.py
      - name: Update images
        run: python update_images.py
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json video_archive.json video_scan_state.json images.json image_archive.json image_scan_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily video rotation"
            git push
          fi
